name: Sync to Public Repo

on:
  push:
    branches: [main]
    tags:
      - '20*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check sync window
        id: timecheck
        run: |
          set -euo pipefail

          # Always sync: manual dispatch, tag push
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — syncing regardless of time."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Tag push — syncing regardless of time."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Time gate: skip during 08:00-18:59 CST (Asia/Shanghai)
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          echo "Current hour (Asia/Shanghai): $HOUR"
          if [[ "$HOUR" -ge 8 && "$HOUR" -lt 19 ]]; then
            echo "Daytime (08:00-19:00 CST) — skipping sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "After hours — proceeding with sync."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.timecheck.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Save commit message
        if: steps.timecheck.outputs.skip != 'true'
        id: commitmsg
        run: |
          MSG="$(git log -1 --format='%s' 2>/dev/null || echo 'update')"
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        if: steps.timecheck.outputs.skip != 'true'
        run: |
          git config --global user.name "TelAgent Bot"
          git config --global user.email "bot@claw-network.github.com"

      - name: Clone public repo
        if: steps.timecheck.outputs.skip != 'true'
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -euo pipefail
          PUBLIC_REPO="https://x-access-token:${PUBLIC_REPO_PAT}@github.com/claw-network/telagent.git"

          if ! git clone --depth 1 "$PUBLIC_REPO" /tmp/public-repo 2>/dev/null; then
            echo "Public repo empty or unreachable — initializing fresh."
            mkdir -p /tmp/public-repo
            cd /tmp/public-repo
            git init -b main
          fi

      - name: Incremental sync via rsync
        if: steps.timecheck.outputs.skip != 'true'
        run: |
          set -euo pipefail

          # Main rsync: sync everything except private paths
          rsync -a --delete \
            --exclude='.git' \
            --exclude='docs' \
            --exclude='skills' \
            --exclude='localdev' \
            --exclude='temp' \
            --exclude='scripts/deploy-node.sh' \
            --exclude='scripts/deploy-install-assets.sh' \
            --exclude='scripts/redeploy.sh' \
            --exclude='.public-sync-ignore' \
            --exclude='.github/copilot-instructions.md' \
            --exclude='.github/copilot-instructions.public.md' \
            --exclude='.github/workflows/sync-public.yml' \
            ./ /tmp/public-repo/

          # Sync docs/guides/ and docs/README.md separately (only public parts of docs/)
          mkdir -p /tmp/public-repo/docs
          if [ -d docs/guides ]; then
            rsync -a --delete docs/guides/ /tmp/public-repo/docs/guides/
          else
            rm -rf /tmp/public-repo/docs/guides
          fi
          [ -f docs/README.md ] && cp docs/README.md /tmp/public-repo/docs/README.md || true

          # Replace copilot instructions with sanitized public version
          cp .github/copilot-instructions.public.md /tmp/public-repo/.github/copilot-instructions.md

          # Defensive cleanup: ensure no private paths leaked into public repo
          cd /tmp/public-repo
          rm -rf skills localdev temp .public-sync-ignore
          rm -rf docs/design docs/implementation docs/issues docs/reply
          rm -f docs/telagent-v1-complete-functional-summary-2026-03-03.md
          rm -f scripts/deploy-node.sh scripts/deploy-install-assets.sh scripts/redeploy.sh
          rm -f .github/copilot-instructions.public.md
          rm -f .github/copilot-instructions.md.bak
          rm -f .github/workflows/sync-public.yml

          echo "=== Incremental sync complete ==="
          ls -d */ .github/ 2>/dev/null || true

      - name: Verify no secrets leaked
        if: steps.timecheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd /tmp/public-repo
          LEAKED=0

          # Known sensitive fragments — unique substrings of real values
          # (fragments only; full values never appear in this file)
          for pattern in \
            "173\.249\.46" \
            "167\.86\.93" \
            "id_ed25519_clawnet" \
            "VLwttmy" \
            "f9be7d917b43f437" \
            "dfcfdf221c2c7e28" \
            "9b6a26bab67a3b8e" \
            "alex\.telagent\.org.*173\|bess\.telagent\.org.*167" \
            "root@173\|root@167" \
            "telagent-dev"; do
            if grep -rqP "$pattern" . \
              --include='*.md' --include='*.yml' --include='*.yaml' \
              --include='*.json' --include='*.ts' --include='*.js' \
              --include='*.sh' --include='*.env' \
              --exclude-dir='.git' 2>/dev/null; then
              echo "LEAK DETECTED: pattern '$pattern' found in:"
              grep -rlP "$pattern" . \
                --include='*.md' --include='*.yml' --include='*.yaml' \
                --include='*.json' --include='*.ts' --include='*.js' \
                --include='*.sh' --include='*.env' \
                --exclude-dir='.git' 2>/dev/null
              LEAKED=1
            fi
          done

          if [[ $LEAKED -eq 1 ]]; then
            echo "::error::Secret leak detected! Aborting sync."
            exit 1
          fi
          echo "✅ No secrets detected in public content."

      - name: Commit and push
        if: steps.timecheck.outputs.skip != 'true'
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -euo pipefail
          cd /tmp/public-repo

          PUBLIC_REPO="https://x-access-token:${PUBLIC_REPO_PAT}@github.com/claw-network/telagent.git"

          git add -A

          # Skip if nothing changed
          if git diff --staged --quiet; then
            echo "✅ No changes to sync."
            exit 0
          fi

          ORIG_MSG="${{ steps.commitmsg.outputs.msg }}"
          git commit -m "$ORIG_MSG"

          # Ensure remote URL is set (for fresh init case)
          git remote set-url origin "$PUBLIC_REPO" 2>/dev/null || git remote add origin "$PUBLIC_REPO"
          git push origin main

          # Sync tag if this is a tag push
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            git tag "$TAG"
            git push origin "$TAG" --force
          fi

          echo "✅ Synced to public repo"
